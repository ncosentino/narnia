site_name: Narnia
site_url: https://www.devleader.ca/projects/narnia/
site_description: MCP server and local Blazor web UI for browsing GitHub Copilot CLI session history. Find and resume sessions after a restart without losing context.
repo_url: https://github.com/ncosentino/narnia
repo_name: ncosentino/narnia
strict: true

copyright: >
  &copy; Nick Cosentino
  <br>
  <a href="https://www.devleader.ca">Dev Leader: software engineering blog and C# tutorials by Nick Cosentino</a>
  <br>
  <a href="https://links.devleader.ca">Dev Leader links: videos, courses, Discord, and social channels</a>
  <br>
  <a href="https://www.brandghost.ai">BrandGhost: social media and SEO automation for brands</a>

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/narnia-logo.png
  favicon: assets/favicon.png
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.highlight
    - search.suggest
    - toc.integrate
  palette:
    - scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Setup by Tool: setup-by-tool.md
  - Configuration: configuration.md
  - Broken Session Recovery: session-recovery.md
  - Collections: collections.md
  - Window Layouts: layouts.md
  - Session Storage: session-storage.md
  - Terminal Window Recovery: terminal-windows.md
  - Live Process Diagnostics: process-diagnostics.md
  - Git Worktrees: worktrees.md
  - Logon Autostart: logon-autostart.md
  - Portable Scheduled Jobs: schedule-portability.md
  - Scheduled Job Health: schedule-health.md
  - MCP Tools:
    - Overview: tools/index.md
    - list_recent_sessions: tools/list-recent-sessions.md
    - search_sessions: tools/search-sessions.md
    - get_session_details: tools/get-session-details.md
    - get_session_checkpoints: tools/get-session-checkpoints.md
    - get_session_turns: tools/get-session-turns.md
    - get_session_workspace: tools/get-session-workspace.md
    - list_sessions_by_repository: tools/list-sessions-by-repository.md
    - list_sessions_by_cwd: tools/list-sessions-by-cwd.md
    - get_session_storage_overview: tools/get-session-storage-overview.md
    - scan_session_storage: tools/scan-session-storage.md
    - preview_local_session_cleanup: tools/preview-local-session-cleanup.md
    - delete_local_sessions: tools/delete-local-sessions.md
    - preview_session_migration: tools/preview-session-migration.md
    - migrate_broken_session: tools/migrate-broken-session.md
    - get_session_recovery_packet: tools/get-session-recovery-packet.md
    - get_session_worktrees: tools/get-session-worktrees.md
    - list_schedules: tools/list-schedules.md
    - get_schedule: tools/get-schedule.md
    - get_schedule_log: tools/get-schedule-log.md
    - create_schedule: tools/create-schedule.md
    - update_schedule: tools/update-schedule.md
    - set_schedule_enabled: tools/set-schedule-enabled.md
    - run_schedule_now: tools/run-schedule-now.md
    - delete_schedule: tools/delete-schedule.md
    - export_schedule_package: tools/export-schedule-package.md
    - build_schedule_package: tools/build-schedule-package.md
    - preview_schedule_package: tools/preview-schedule-package.md
    - import_schedule_package: tools/import-schedule-package.md
  - Skills:
    - Overview: skills/index.md
    - narnia-web-server: skills/narnia-web-server.md
    - narnia-scheduler: skills/narnia-scheduler.md
    - narnia-report-email: skills/narnia-report-email.md
  - Troubleshooting: troubleshooting.md
  - Building from Source: building.md
  - Design & Decisions:
    - Data Storage Ownership: design/data-storage.md
    - Delivery: design/delivery.md
    - Architecture Decision Records: adr/index.md
    - "ADR-0001: Session store is read-only": adr/adr-0001-copilot-owned-session-store-is-read-only.md
    - "ADR-0002: Settings database location": adr/adr-0002-settings-database-lives-in-local-app-data.md
    - "ADR-0003: Collections organize sessions": adr/adr-0003-collections-are-the-session-organization-model.md
    - "ADR-0004: Window Layouts compose Collections": adr/adr-0004-window-layouts-compose-collections.md
    - "ADR-0005: Layout editor mixed content": adr/adr-0005-layout-editor-supports-mixed-window-content.md
  - Articles: articles.md

plugins:
  - search
  - meta

hooks:
  - docs/hooks/schema.py
  - docs/hooks/llms_txt.py

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.magiclink
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 4

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ncosentino/narnia

docs_dir: docs
